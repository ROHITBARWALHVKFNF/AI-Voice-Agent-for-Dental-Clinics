services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dental_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_ai
      POSTGRES_USER: dental_admin
      POSTGRES_PASSWORD: dental_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dental_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: